<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Oefentoets wiskunde 1ste jaar: bewerkingen met positieve getallen. 20 meerkeuzevragen met verbetering en uitleg.">
<title>Toets Positieve Getallen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: één kolom als een toetsblad op ruitjespapier; vragen gegroepeerd per onderdeel, onderaan een vaste indienbalk. */
:root {
  --paper: #f7f9fc;
  --sheet: #ffffff;
  --grid: #e3e9f3;
  --ink: #1b2540;
  --muted: #5d6a85;
  --line: #d5dceb;
  --accent: #2f4fd8;
  --accent-ink: #ffffff;
  --marker: #ffe45c;
  --ok: #17845a;
  --ok-bg: #e2f5ec;
  --bad: #c43a3a;
  --bad-bg: #fbe7e7;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10141f; --sheet: #171d2c; --grid: #1c2335; --ink: #e6eaf5; --muted: #9aa5c0;
    --line: #2b3550; --accent: #7d97ff; --accent-ink: #0d1222; --marker: #8a7a1c;
    --ok: #4fd29b; --ok-bg: #12352a; --bad: #ff8585; --bad-bg: #3d1a1d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10141f; --sheet: #171d2c; --grid: #1c2335; --ink: #e6eaf5; --muted: #9aa5c0;
  --line: #2b3550; --accent: #7d97ff; --accent-ink: #0d1222; --marker: #8a7a1c;
  --ok: #4fd29b; --ok-bg: #12352a; --bad: #ff8585; --bad-bg: #3d1a1d; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 120px;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
header.top { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
h1 { font-size: clamp(28px, 6vw, 42px); font-weight: 800; line-height: 1.1; }
h1 mark { background: linear-gradient(transparent 55%, var(--marker) 55%); color: inherit; padding: 0 2px; }
.sub { color: var(--muted); margin: 0; }

.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.controls .left, .controls .right { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button { font: inherit; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--sheet); color: var(--ink); border-radius: 8px; padding: 9px 14px; font-weight: 700; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:focus-visible, .opt:focus-visible, select:focus-visible { outline: 3px solid var(--marker); outline-offset: 2px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.timer { font-variant-numeric: tabular-nums; font-family: var(--font-display); font-weight: 800; font-size: 22px; min-width: 5ch; }
.timer.warn { color: var(--bad); }
label.lim { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 15px; }
select { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); }

.result { display: grid; grid-template-columns: auto 1fr; gap: 16px 24px; align-items: center; }
.big { font-family: var(--font-display); font-weight: 800; font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; }
.big small { font-size: 24px; color: var(--muted); }
.result p { margin: 0; }
.bysec { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.bysec div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.bysec b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }

section.sec { display: flex; flex-direction: column; gap: 12px; }
section.sec > h2 { font-size: 20px; display: flex; gap: 10px; align-items: baseline; }
.secnr { background: var(--ink); color: var(--sheet); font-size: 14px; padding: 2px 8px; border-radius: 4px; font-variant-numeric: tabular-nums; }

.q { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.q.right { border-color: var(--ok); }
.q.wrong { border-color: var(--bad); }
.qhead { display: flex; gap: 12px; align-items: flex-start; }
.qnr { flex: none; width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; background: var(--grid); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; }
.q.right .qnr { background: var(--ok); color: var(--sheet); }
.q.wrong .qnr { background: var(--bad); color: var(--sheet); }
.qtext { margin: 0; padding-top: 2px; min-width: 0; overflow-wrap: anywhere; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 560px) { .opts { grid-template-columns: 1fr; } .result { grid-template-columns: 1fr; } }
.opt { display: flex; gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); border-radius: 8px; padding: 9px 12px; min-width: 0; }
.opt .letter { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.opt .val { min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt.sel .letter { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt:disabled { cursor: default; }
.opt.is-correct { background: var(--ok-bg); border-color: var(--ok); }
.opt.is-correct .letter { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.opt.is-wrong { background: var(--bad-bg); border-color: var(--bad); }
.opt.is-wrong .letter { background: var(--bad); border-color: var(--bad); color: var(--sheet); }
.expl { margin: 0; font-size: 15px; color: var(--ink); background: var(--grid); border-radius: 6px; padding: 10px 12px; }
.expl b { color: var(--muted); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin-right: 6px; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--sheet); border-top: 1px solid var(--line);
  padding-top: 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar .in { max-width: 760px; margin: 0 auto; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.progress { flex: 1 1 200px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
.track { height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.confirm { font-size: 14px; color: var(--bad); }

.hist h3 { font-size: 17px; margin-bottom: 10px; }
.hist ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.hist li { display: grid; grid-template-columns: 9.5em 1fr 3.2em 4em; gap: 10px; align-items: center; font-size: 14px; font-variant-numeric: tabular-nums; }
.hist .hb { height: 10px; border-radius: 5px; background: var(--grid); overflow: hidden; }
.hist .hb i { display: block; height: 100%; background: var(--accent); }
.hist .empty { color: var(--muted); font-size: 15px; margin: 0; }
.hist .muted { color: var(--muted); }
.linkbtn { background: none; border: none; color: var(--muted); text-decoration: underline; padding: 0; font-size: 14px; }
@media (max-width: 480px) { .hist li { grid-template-columns: 7.5em 1fr 3em; } .hist li .t { display: none; } }
@media (prefers-reduced-motion: reduce) { .track i { transition: none; } }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="eyebrow">Wiskunde · 1ste jaar · Hoofdstuk 3</span>
    <h1>Bewerkingen met <mark>positieve getallen</mark></h1>
    <p class="sub">20 meerkeuzevragen, 4 per onderdeel. Zonder rekentoestel. Kladpapier mag.</p>
  </header>

  <div class="panel controls">
    <div class="left">
      <button class="btn primary" id="newBtn" type="button">Nieuwe vragen</button>
      <label class="lim" for="limit">Tijdslimiet
        <select id="limit">
          <option value="0">geen</option>
          <option value="15">15 min</option>
          <option value="20">20 min</option>
          <option value="30">30 min</option>
          <option value="45">45 min</option>
        </select>
      </label>
    </div>
    <div class="right">
      <span class="timer" id="timer" aria-live="off">0:00</span>
    </div>
  </div>

  <div class="panel result" id="result" hidden></div>

  <div id="test"></div>

  <div class="panel hist" id="hist"></div>
</div>

<div class="bar" id="bar">
  <div class="in">
    <div class="progress">
      <span id="progText">0 van 20 beantwoord</span>
      <div class="track"><i id="progBar"></i></div>
    </div>
    <span class="confirm" id="confirmMsg" hidden></span>
    <button class="btn primary" id="submitBtn" type="button">Indienen</button>
  </div>
</div>

<script>
const SECTIONS = {
  1: "Ordenen en de getallenas",
  2: "De vier hoofdbewerkingen",
  3: "Eigenschappen van de bewerkingen",
  4: "Volgorde van de bewerkingen",
  5: "Machten en vierkantswortels"
};

// [onderdeel, vraag, [juist, fout, fout, fout], uitleg]
const BANK = [
// ---------- 3.1 Ordenen ----------
[1,"Welk getal is het kleinst?",["52,000 9","52,001","52,01","52,1"],"Gelijk aantal gehelen (52). Vergelijk cijfer per cijfer na de komma: 52,000 9 heeft op de derde decimaal een 0, 52,001 een 1."],
[1,"Welk symbool hoort op de plaats van de puntjes?  1,011 … 1,001",[">","<","=","≤"],"Gehelen gelijk, eerste decimaal gelijk (0). Tweede decimaal: 1 > 0, dus 1,011 > 1,001."],
[1,"Welk symbool hoort op de plaats van de puntjes?  0,009 … 0,008 9",[">","<","=","≤"],"Schrijf 0,009 als 0,009 0. Op de derde decimaal: 9 > 8, dus 0,009 > 0,008 9."],
[1,"Welk symbool hoort op de plaats van de puntjes?  3,68 … 3,8",["<",">","=","≥"],"Gehelen gelijk (3). Eerste decimaal: 6 < 8, dus 3,68 < 3,8."],
[1,"Wat betekent het symbool ≤ ?",["is kleiner dan of gelijk aan","is groter dan of gelijk aan","is niet gelijk aan","is veel kleiner dan"],"≤ betekent 'is kleiner dan of gelijk aan'."],
[1,"Wat betekent het symbool ≠ ?",["is niet gelijk aan","is ongeveer gelijk aan","is kleiner dan of gelijk aan","is groter dan"],"≠ betekent 'is niet gelijk aan'."],
[1,"Hoe schrijf je 'x is groter dan of gelijk aan 4'?",["x ≥ 4","x > 4","x ≤ 4","x ≠ 4"],"'Groter dan of gelijk aan' is het symbool ≥."],
[1,"Welke natuurlijke getallen n voldoen aan 5,1 < n < 8,3?",["6, 7 en 8","5, 6, 7 en 8","6 en 7","6, 7, 8 en 9"],"n moet groter zijn dan 5,1 en kleiner dan 8,3. De natuurlijke getallen daartussen zijn 6, 7 en 8."],
[1,"Welke natuurlijke getallen n voldoen aan 5 < n < 6?",["geen enkel","5","6","5 en 6"],"Tussen 5 en 6 ligt geen enkel natuurlijk getal, en 5 en 6 zelf tellen niet mee (strikt kleiner/groter)."],
[1,"Welke natuurlijke getallen n voldoen aan 5 < n ≤ 6?",["6","5","5 en 6","geen enkel"],"5 telt niet mee (<), 6 wel (≤). Enkel 6 voldoet."],
[1,"Welke natuurlijke getallen n voldoen aan 3 ≤ n < 4?",["3","4","3 en 4","geen enkel"],"3 telt mee (≤), 4 niet (<). Enkel 3 voldoet."],
[1,"Welke natuurlijke getallen n voldoen aan 5,009 ≥ n > 0?",["1, 2, 3, 4 en 5","0, 1, 2, 3, 4 en 5","1, 2, 3 en 4","geen enkel"],"n moet groter zijn dan 0 (dus 0 niet) en hoogstens 5,009. Dat zijn 1, 2, 3, 4 en 5."],
[1,"Hoeveel natuurlijke getallen n voldoen aan 16 ≥ n ≥ 12,03?",["4","5","3","6"],"Dat zijn 13, 14, 15 en 16: vier getallen. 12 is kleiner dan 12,03 en telt dus niet mee."],
[1,"Wat is het grootste natuurlijke getal dat kleiner is dan 10,99?",["10","11","10,9","9"],"Natuurlijke getallen hebben geen decimalen. 11 is te groot, dus 10."],
[1,"Hoeveel decimale getallen met één decimaal liggen strikt tussen 1,1 en 2?",["8","9","10","7"],"Dat zijn 1,2 · 1,3 · 1,4 · 1,5 · 1,6 · 1,7 · 1,8 · 1,9: acht getallen."],
[1,"Wat is het grootste getal met één decimaal waarvoor 2,2 < d < 3?",["2,9","3,0","2,99","2,8"],"3,0 = 3 mag niet (strikt kleiner). 2,99 heeft twee decimalen. Het grootste is 2,9."],
[1,"Wat is het grootste getal met één decimaal waarvoor 9,8 < d ≤ 10,3?",["10,3","10,2","10,4","9,9"],"10,3 mag (≤). Het grootste getal met één decimaal is dus 10,3."],
[1,"Hoeveel getallen met één decimaal liggen strikt tussen 0,4 en 0,5?",["geen enkel","1","9","10"],"Na 0,4 komt met één decimaal meteen 0,5. Daartussen ligt geen getal met één decimaal."],
[1,"Welke rangschikking van klein naar groot is juist?",["3,24 < 3,42 < 32,3 < 32,4","3,42 < 3,24 < 32,3 < 32,4","3,24 < 32,3 < 3,42 < 32,4","32,4 < 32,3 < 3,42 < 3,24"],"Eerst kijken naar de gehelen (3 en 32), dan naar de decimalen."],
[1,"Welke rangschikking van klein naar groot is juist?",["4,474 < 4,74 < 4,774","4,74 < 4,474 < 4,774","4,774 < 4,74 < 4,474","4,474 < 4,774 < 4,74"],"Eerste decimalen: 4, 7, 7. Dus 4,474 is het kleinst. Bij 4,74 en 4,774 beslist de tweede decimaal: 4 < 7."],
[1,"Welke rangschikking van groot naar klein is juist?",["70,64 > 70,46 > 7,46 > 7,064","70,46 > 70,64 > 7,46 > 7,064","7,46 > 7,064 > 70,64 > 70,46","70,64 > 7,46 > 70,46 > 7,064"],"Eerst de gehelen: 70 > 7. Daarna de decimalen: 0,64 > 0,46 en 0,46 > 0,064."],
[1,"Welke uitspraak is juist?",["12,58 < 12,85","12,85 < 12,58","115,28 > 115,82","15,82 > 112,58"],"Bij 12,58 en 12,85 beslist de eerste decimaal: 5 < 8."],
[1,"Welke uitspraak is waar?",["7 ≤ 7","7 < 7","7 ≠ 7","7 > 7"],"≤ betekent 'kleiner dan of gelijk aan'. 7 is gelijk aan 7, dus 7 ≤ 7 is waar."],
[1,"Welk getal is het kleinst?",["0,000 54","0,004 5","0,045","0,054"],"Tel de nullen na de komma: 0,000 54 begint pas op de vierde decimaal en is het kleinst."],
[1,"Welk getal ligt het verst naar rechts op de getallenas?",["0,5","0,49","0,099","0,45"],"Hoe verder naar rechts, hoe groter. 0,5 = 0,50 is het grootst."],
[1,"Welk getal ligt het dichtst bij 0 op de getallenas?",["0,008 5","0,009","0,01","0,085"],"Het kleinste getal ligt het dichtst bij 0. Op de derde decimaal: 0,008 5 heeft een 8, 0,009 een 9."],
[1,"Een sterretje ★ stelt één cijfer voor. Welke cijfers kunnen op de plaats van ★ in 23,★3 < 23,42?",["0, 1, 2 of 3","0, 1, 2, 3 of 4","4, 5, 6, 7, 8 of 9","alleen 3"],"Is ★ kleiner dan 4, dan is het getal kleiner. Bij ★ = 4 krijg je 23,43, en dat is groter dan 23,42."],
[1,"Op een getallenas staan de getallen van links naar rechts geordend …",["van klein naar groot","van groot naar klein","willekeurig","per tiental"],"De pijl wijst naar rechts: daar worden de getallen groter."],
[1,"Waarvoor dient de pijl op een getallenas?",["Hij toont in welke richting de getallen groter worden","Hij toont waar 0 ligt","Hij toont de ijk","Hij toont het grootste getal"],"De pijl duidt aan in welke richting de getallen in waarde toenemen."],
[1,"Hoe noemen we de twee getallen (meestal 0 en 1) die bepalen waar alle andere getallen op de getallenas komen?",["de ijk","de pijl","de termen","het grondtal"],"Twee getallen die de ijk vormen. De afstand ertussen bepaalt de plaats van alle andere getallen."],
[1,"Tussen 0 en 1 op een getallenas staan 10 gelijke vakjes. Hoeveel is één vakje waard?",["0,1","1","0,01","10"],"1 verdeeld in 10 gelijke stukken: elk stuk is 1 : 10 = 0,1."],
[1,"Tussen 2 en 3 zijn 4 gelijke stukken. Welk getal hoort bij het punt 3 stukken rechts van 2?",["2,75","2,3","2,6","2,25"],"Eén stuk is 1 : 4 = 0,25. Drie stukken: 0,75. Dus 2 + 0,75 = 2,75."],
[1,"Welk getal ligt precies in het midden tussen 6 en 7?",["6,5","6,05","6,1","7,5"],"Het midden tussen twee opeenvolgende gehelen is het geheel + 0,5."],
[1,"Welk getal ligt precies in het midden tussen 1,2 en 1,3?",["1,25","1,5","1,22","1,35"],"Schrijf 1,20 en 1,30. Het midden is 1,25."],
[1,"Welk getal ligt tussen 3,7 en 3,8?",["3,75","3,08","3,85","3,69"],"3,75 = 3,750 ligt tussen 3,700 en 3,800."],
[1,"Op een getallenas staan 1990 en 2000 vijf vakjes uit elkaar. Hoeveel is één vakje waard?",["2","5","10","1"],"Het verschil is 10, verdeeld over 5 vakjes: 10 : 5 = 2."],

// ---------- 3.2 Vier hoofdbewerkingen ----------
[2,"In 72,5 + 18,3 = 90,8 noemen we 90,8 …",["de som","het verschil","het product","een term"],"Bij een optelling heten de getallen die je optelt termen; het resultaat is de som."],
[2,"In 90,8 − 18,3 = 72,5 noemen we 18,3 …",["de aftrekker","het aftrektal","het verschil","een factor"],"Aftrektal − aftrekker = verschil. 18,3 is de aftrekker."],
[2,"In 90,8 − 18,3 = 72,5 noemen we 90,8 …",["het aftrektal","de aftrekker","het verschil","de som"],"Aftrektal − aftrekker = verschil. 90,8 is het aftrektal."],
[2,"In 90,8 − 18,3 = 72,5 noemen we 72,5 …",["het verschil","het aftrektal","de som","het quotiënt"],"Het resultaat van een aftrekking heet het verschil."],
[2,"In 18,5 · 1,5 = 27,75 noemen we 18,5 en 1,5 …",["factoren","termen","delers","machten"],"De getallen die je vermenigvuldigt heten factoren; het resultaat is het product."],
[2,"In 18,5 · 1,5 = 27,75 noemen we 27,75 …",["het product","de som","het quotiënt","een factor"],"Het resultaat van een vermenigvuldiging heet het product."],
[2,"In 98 : 4 = 24,5 noemen we 4 …",["de deler","het deeltal","het quotiënt","een factor"],"Deeltal : deler = quotiënt. 4 is de deler."],
[2,"In 98 : 4 = 24,5 noemen we 98 …",["het deeltal","de deler","het quotiënt","het product"],"Deeltal : deler = quotiënt. 98 is het deeltal."],
[2,"In 98 : 4 = 24,5 noemen we 24,5 …",["het quotiënt","het deeltal","de deler","het verschil"],"Het resultaat van een deling heet het quotiënt."],
[2,"Waarom bestaat 5 : 0 niet?",["Geen enkel getal maal 0 geeft 5","Omdat het antwoord 0 is","Omdat het antwoord 5 is","Omdat 0 geen getal is"],"Delen door 0 gaat niet: je kan 5 nooit schrijven als het product van 0 en een ander getal."],
[2,"Welke bewerkingen noemen we de vier hoofdbewerkingen?",["optelling, aftrekking, vermenigvuldiging, deling","optelling, aftrekking, machten, wortels","vermenigvuldiging, deling, machten, wortels","optelling, vermenigvuldiging, machten, deling"],"De optelling, de aftrekking, de vermenigvuldiging en de deling zijn de vier hoofdbewerkingen."],

[2,"Hoe schrijf je 4,1 + 4,1 + 4,1 + 4,1 + 4,1 + 4,1 + 4,1 korter?",["7 · 4,1","4,1⁷","7 + 4,1","4,1 · 4,1"],"7 gelijke termen 4,1 schrijf je als 7 · 4,1."],

const PER_SECTION = 4;
const LETTERS = ["A","B","C","D"];
const LS_HIST = "h3toets.history";
const LS_SEEN = "h3toets.seen";
const LS_LIMIT = "h3toets.limit";

function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let state = null;
let tick = null;

function pickQuestions() {
  let seen = lsGet(LS_SEEN, []);
  const picked = [];
  for (const sec of [1,2,3,4,5]) {
    const ids = BANK.map((q, i) => q[0] === sec ? i : -1).filter(i => i >= 0);
    let fresh = ids.filter(i => !seen.includes(i));
    if (fresh.length < PER_SECTION) {
      // alle vragen van dit onderdeel gezien: opnieuw beginnen
      seen = seen.filter(i => BANK[i][0] !== sec);
      fresh = ids;
    }
    picked.push(...shuffle(fresh).slice(0, PER_SECTION));
  }
  lsSet(LS_SEEN, seen.concat(picked));
  return picked;
}

function newTest() {
  const ids = pickQuestions();
  state = {
    ids,
    orders: ids.map(() => shuffle([0,1,2,3])),
    answers: ids.map(() => null),
    submitted: false,
    start: Date.now(),
    elapsed: 0,
    limit: Number(document.getElementById("limit").value) || 0
  };
  render();
  startTimer();
  window.scrollTo({ top: 0 });
}

function fmt(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }

function elapsedNow() { return state.submitted ? state.elapsed : (Date.now() - state.start) / 1000; }

function updateTimer() {
  const el = document.getElementById("timer");
  const e = elapsedNow();
  if (state.limit && !state.submitted) {
    const left = state.limit * 60 - e;
    el.textContent = fmt(left);
    el.title = "Resterende tijd";
    el.classList.toggle("warn", left <= 60);
    if (left <= 0) submit(true);
  } else {
    el.textContent = fmt(e);
    el.title = state.submitted ? "Gebruikte tijd" : "Verstreken tijd";
    el.classList.remove("warn");
  }
}

function startTimer() { clearInterval(tick); updateTimer(); tick = setInterval(updateTimer, 500); }

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function render() {
  const test = document.getElementById("test");
  let html = "";
  let n = 0;
  let lastSec = 0;
  state.ids.forEach((id, qi) => {
    const [sec, text, opts, expl] = BANK[id];
    if (sec !== lastSec) {
      if (lastSec) html += "</section>";
      html += `<section class="sec"><h2><span class="secnr">3.${sec}</span>${SECTIONS[sec]}</h2>`;
      lastSec = sec;
    }
    n++;
    const chosen = state.answers[qi];
    let cls = "q";
    if (state.submitted) cls += chosen === 0 ? " right" : " wrong";
    html += `<div class="${cls}" id="q${qi}"><div class="qhead"><span class="qnr">${n}</span><p class="qtext">${esc(text)}</p></div><div class="opts" role="radiogroup" aria-label="Vraag ${n}">`;
    state.orders[qi].forEach((oi, pos) => {
      let oc = "opt";
      if (chosen === oi) oc += " sel";
      if (state.submitted) {
        if (oi === 0) oc += " is-correct";
        else if (chosen === oi) oc += " is-wrong";
      }
      html += `<button type="button" class="${oc}" role="radio" aria-checked="${chosen === oi}" data-q="${qi}" data-o="${oi}" ${state.submitted ? "disabled" : ""}><span class="letter">${LETTERS[pos]}</span><span class="val">${esc(opts[oi])}</span></button>`;
    });
    html += "</div>";
    if (state.submitted) {
      const lead = chosen === null ? "Niet beantwoord." : chosen === 0 ? "Juist!" : "Fout.";
      html += `<p class="expl"><b>${lead}</b>${esc(expl)}</p>`;
    }
    html += "</div>";
  });
  html += "</section>";
  test.innerHTML = html;
  renderResult();
  updateProgress();
  renderHistory();
}

function updateProgress() {
  const done = state.answers.filter(a => a !== null).length;
  const total = state.ids.length;
  document.getElementById("progText").textContent = state.submitted
    ? `Ingediend · ${score()} van ${total} juist`
    : `${done} van ${total} beantwoord`;
  document.getElementById("progBar").style.width = (state.submitted ? score() : done) / total * 100 + "%";
  const btn = document.getElementById("submitBtn");
  btn.textContent = state.submitted ? "Nieuwe vragen" : "Indienen";
  document.getElementById("confirmMsg").hidden = true;
  pendingConfirm = false;
}

function score() { return state.answers.filter(a => a === 0).length; }

function verdict(s) {
  if (s >= 18) return "Uitstekend! Je beheerst dit hoofdstuk.";
  if (s >= 14) return "Goed gedaan. Bekijk de fouten nog even.";
  if (s >= 10) return "Voldoende. Herhaal de onderdelen met de meeste fouten.";
  return "Nog niet voldoende. Lees de theorie opnieuw en probeer nog een toets.";
}

function renderResult() {
  const box = document.getElementById("result");
  if (!state.submitted) { box.hidden = true; box.innerHTML = ""; return; }
  const s = score();
  let secs = "";
  for (const sec of [1,2,3,4,5]) {
    let ok = 0, tot = 0;
    state.ids.forEach((id, qi) => { if (BANK[id][0] === sec) { tot++; if (state.answers[qi] === 0) ok++; } });
    secs += `<div><b>${ok}/${tot}</b>3.${sec} ${SECTIONS[sec]}</div>`;
  }
  box.innerHTML = `<div class="big">${s}<small>/20</small></div>
    <div><p><strong>${verdict(s)}</strong></p><p class="sub">Tijd: ${fmt(state.elapsed)}${state.timedOut ? " · de tijd was om" : ""}. De juiste antwoorden staan in het groen, met uitleg.</p></div>
    <div class="bysec">${secs}</div>`;
  box.hidden = false;
}

let pendingConfirm = false;
function submit(force) {
  if (state.submitted) return;
  const open = state.answers.filter(a => a === null).length;
  if (open && !force && !pendingConfirm) {
    pendingConfirm = true;
    const m = document.getElementById("confirmMsg");
    m.textContent = `Nog ${open} open. Klik opnieuw om toch in te dienen.`;
    m.hidden = false;
    document.getElementById("submitBtn").textContent = "Toch indienen";
    return;
  }
  state.elapsed = (Date.now() - state.start) / 1000;
  if (state.limit) state.elapsed = Math.min(state.elapsed, state.limit * 60);
  state.timedOut = !!force;
  state.submitted = true;
  const hist = lsGet(LS_HIST, []);
  hist.unshift({ d: Date.now(), s: score(), t: Math.round(state.elapsed) });
  lsSet(LS_HIST, hist.slice(0, 30));
  render();
  updateTimer();
  window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}

function renderHistory() {
  const el = document.getElementById("hist");
  const hist = lsGet(LS_HIST, []);
  if (!hist.length) {
    el.innerHTML = `<h3>Jouw scores</h3><p class="empty">Nog geen toetsen ingediend. Na het indienen verschijnt je score hier, zodat je je vooruitgang ziet.</p>`;
    return;
  }
  const avg = hist.reduce((a, h) => a + h.s, 0) / hist.length;
  const rows = hist.slice(0, 10).map(h => {
    const d = new Date(h.d);
    const ds = d.toLocaleDateString("nl-BE", { day: "numeric", month: "short" }) + " " + d.toLocaleTimeString("nl-BE", { hour: "2-digit", minute: "2-digit" });
    return `<li><span class="muted">${ds}</span><span class="hb"><i style="width:${h.s / 20 * 100}%"></i></span><b>${h.s}/20</b><span class="t muted">${fmt(h.t)}</span></li>`;
  }).join("");
  el.innerHTML = `<h3>Jouw scores <span class="muted" style="font-weight:400;font-size:14px">· gemiddeld ${avg.toFixed(1).replace(".", ",")}/20 over ${hist.length} toets${hist.length > 1 ? "en" : ""}</span></h3><ol>${rows}</ol>
    <p style="margin:10px 0 0"><button type="button" class="linkbtn" id="clearHist">Scores wissen</button></p>`;
}

document.getElementById("test").addEventListener("click", e => {
  const b = e.target.closest(".opt");
  if (!b || state.submitted) return;
  const qi = Number(b.dataset.q), oi = Number(b.dataset.o);
  state.answers[qi] = oi;
  b.parentElement.querySelectorAll(".opt").forEach(x => {
    const on = Number(x.dataset.o) === oi;
    x.classList.toggle("sel", on);
    x.setAttribute("aria-checked", on);
  });
  updateProgress();
});

document.getElementById("submitBtn").addEventListener("click", () => {
  if (state.submitted) newTest(); else submit(false);
});
document.getElementById("newBtn").addEventListener("click", newTest);
document.getElementById("limit").addEventListener("change", e => {
  lsSet(LS_LIMIT, e.target.value);
  if (!state.submitted) { state.limit = Number(e.target.value) || 0; updateTimer(); }
});
document.getElementById("hist").addEventListener("click", e => {
  if (e.target.id !== "clearHist") return;
  if (e.target.dataset.armed) { lsSet(LS_HIST, []); renderHistory(); }
  else { e.target.dataset.armed = "1"; e.target.textContent = "Klik nogmaals om alle scores te wissen"; }
});

function boot(data) {
  const lim = lsGet(LS_LIMIT, "0");
  document.getElementById("limit").value = lim;
  if (data && data.state) {
    state = data.state;
    // tijd verder laten lopen vanaf de bewaarde verstreken tijd
    if (!state.submitted) state.start = Date.now() - (data.elapsedAtSnapshot || 0) * 1000;
    render();
    startTimer();
  } else {
    newTest();
  }
}
window.claude?.hot?.snapshot?.(() => ({ state, elapsedAtSnapshot: state ? elapsedNow() : 0 }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
